# Render Blueprint for the DevReel FastAPI backend.
# Deploy: Render → New → Blueprint → point at this repo. Render reads this file.
#
# Durable storage comes from an EXTERNAL free Postgres (Neon or Supabase), set
# via the DATABASE_URL secret below — so shared résumé links survive restarts
# and redeploys with no paid disk. The free instance is fine (it sleeps on idle,
# but the data lives in Postgres, not on the container).
#
# ENVIRONMENT=production makes the app refuse to boot on config that would
# otherwise fail silently: a non-Postgres DATABASE_URL, or a missing
# GITHUB_TOKEN. Both look healthy locally and break only under real traffic.
services:
  - type: web
    name: devreel-api
    runtime: docker
    repo: # optional: set to your Git repo URL, or connect it in the dashboard
    rootDir: proof-xyz/apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false   # set in the Render dashboard
      - key: WEB_BASE_URL
        sync: false   # your Vercel domain, e.g. https://devreel.vercel.app
                      # comma-separate to allow preview deploys as CORS origins
      - key: API_BASE_URL
        sync: false   # this service's URL, e.g. https://devreel-api.onrender.com
      - key: DATABASE_URL
        sync: false   # Neon/Supabase Postgres DSN, e.g.
                      # postgresql://user:pass@host/db?sslmode=require
      # REQUIRED. Without it GitHub allows 60 req/hr, which is not enough to
      # complete even one profile ingest (~9 calls per repo). A classic PAT with
      # no scopes covers public repos; add the `repo` scope for private ones.
      - key: GITHUB_TOKEN
        sync: false
      # Optional — only for the "connect with GitHub" private-repo flow.
      # The OAuth app's callback URL must be:
      #   https://<API_BASE_URL>/api/auth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Cost and latency controls. 15 repos ≈ 135 GitHub calls per cold generate.
      - key: MAX_REPOS
        value: "15"
      - key: PROFILE_CACHE_HOURS
        value: "24"
      - key: GENERATE_RATE_LIMIT
        value: "30"
      - key: GENERATE_GLOBAL_HOURLY_CAP
        value: "1000"
      # Concurrency. The API is I/O-bound and every blocking call (DB, LLM) runs
      # on a worker thread, so one async worker serves many simultaneous users.
      # Keep it at ONE worker: the rate limiter holds its counters in process
      # memory, so N workers would multiply the effective limits by N.
      - key: GITHUB_CONCURRENCY
        value: "16"
      - key: DB_POOL_MAX_SIZE
        value: "16"
